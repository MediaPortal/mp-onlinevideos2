# Define onlinevideos_backend in your private nginx configuration; use a trusted loopback backend.
# Temporary read-only public HTTP test listener. This does not enable TLS.
# Load within nginx's http context. Use unique shared-zone names.
limit_req_zone $binary_remote_addr zone=ov_net10_test_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ov_net10_test_connections:10m;
server {
    listen 5088;
    listen [::]:5088;
    server_name _;
    access_log /var/log/nginx/onlinevideos-net10-test.access.log;
    error_log /var/log/nginx/onlinevideos-net10-test.error.log;
    client_max_body_size 16m;
    client_body_timeout 15s;
    limit_req zone=ov_net10_test_rate burst=50 nodelay;
    limit_req_status 429;
    limit_conn ov_net10_test_connections 10;
    limit_conn_status 429;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # Reject writes at the edge before buffering their bodies on this plaintext listener.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    location / {
        proxy_pass http://onlinevideos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
